name: one-time-tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-before-review-comments-address-runbook.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create requested marker
        env:
          TAG_NAME: BEFORE-REVIEW-COMMENTS-ADDRESS-RUNBOOK
        run: |
          target="$(git rev-parse HEAD^)"
          remote_ref="$(git ls-remote --tags origin "refs/tags/$TAG_NAME" | awk '{print $1}')"
          if [ -n "$remote_ref" ]; then
            if [ "$remote_ref" != "$target" ]; then
              echo "Requested tag already exists at a different commit."
              exit 1
            fi
          else
            git tag "$TAG_NAME" "$target"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Remove one-time workflow
        run: |
          git config user.name "zx-carrom-release"
          git config user.email "zx-carrom-release@users.noreply.github.com"
          git rm .github/workflows/tag-before-review-comments-address-runbook.yml
          git commit -m "Remove one-time tag workflow"
          git push origin HEAD:main
