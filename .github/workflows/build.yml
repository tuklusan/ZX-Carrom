name: build-dist

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zx-carrom-build-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Pasmo
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tuklusan/pasmo /tmp/pasmo
          cd /tmp/pasmo
          ./configure
          make -j2

      - name: Build ZX-Carrom
        env:
          PASMO: /tmp/pasmo/pasmo
        run: python3 build.py

      - name: Commit dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist is already current"
            exit 0
          fi
          git commit -m "Refresh dist"
          git push
