name: clean-build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - '.github/workflows/tag-*.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zx-carrom-clean-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PASMO_REF: ef6d399c770a30fbd8bdaa7272ccc7e2b0bcf0dd
      ZQLOADER_REF: ca5913fb563be1903f70aab9e88b0497606769f4
      SKOOLKIT_REF: 5a46d5066f9ceafee70aa9020de88437971cc714
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Repository vocabulary gate
        run: |
          python3 tools/check_restricted_terms.py --tree --head-message

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake make git python3 python3-venv
          python3 -m venv /tmp/zxrun
          git clone https://github.com/tuklusan/skoolkit.git /tmp/skoolkit
          git -C /tmp/skoolkit checkout "$SKOOLKIT_REF"
          /tmp/zxrun/bin/pip install --disable-pip-version-check /tmp/skoolkit pillow

      - name: Build Pasmo from authoritative fork
        run: |
          git clone https://github.com/tuklusan/pasmo.git /tmp/pasmo
          git -C /tmp/pasmo checkout "$PASMO_REF"
          cd /tmp/pasmo
          ./configure
          make -j2
          ./pasmo --version || true

      - name: Build ZQLoader host tool
        run: |
          git clone https://github.com/tuklusan/zqloader.git /tmp/zqloader
          git -C /tmp/zqloader checkout "$ZQLOADER_REF"
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('/tmp/zqloader/turboblock.h')
          s = p.read_text()
          old = '        m_pilot_length = p_duration;\n    }'
          new = '        m_pilot_length = p_duration;\n        return *this;\n    }'
          if s.count(old) != 1:
              raise SystemExit('unexpected ZQLoader SetPilotLength source')
          p.write_text(s.replace(old, new))
          q = Path('/tmp/zqloader/main.cpp')
          t = q.read_text()
          old2 = '        // zqloader.SetCompressionType(CompressionType::none); // @DEBUG'
          new2 = '        zqloader.SetCompressionType(CompressionType::none);'
          if t.count(old2) != 1:
              raise SystemExit('unexpected ZQLoader compression source')
          q.write_text(t.replace(old2, new2))
          PYFIX
          cmake -S /tmp/zqloader -B /tmp/zqloader-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
          cmake --build /tmp/zqloader-build --target zqloader -j2
          /tmp/zqloader-build/zqloader version || true

      - name: Clean production build 1
        env:
          PASMO: /tmp/pasmo/pasmo
          ZQLOADER: /tmp/zqloader-build/zqloader
        run: |
          python3 build.py
          python3 tools/package_release.py dist/zx-carrom.zip
          mkdir -p /tmp/build1
          cp build/carrom.bin dist/carrom.tap dist/carrom_fast.tzx dist/zx-carrom.zip /tmp/build1/

      - name: Clean production build 2 and reproducibility check
        env:
          PASMO: /tmp/pasmo/pasmo
          ZQLOADER: /tmp/zqloader-build/zqloader
        run: |
          python3 build.py
          python3 tools/package_release.py dist/zx-carrom.zip
          cmp /tmp/build1/carrom.bin build/carrom.bin
          cmp /tmp/build1/carrom.tap dist/carrom.tap
          cmp /tmp/build1/carrom_fast.tzx dist/carrom_fast.tzx
          cmp /tmp/build1/zx-carrom.zip dist/zx-carrom.zip

      - name: Runtime tape and play checks
        run: |
          cp build/carrom.sym tools/carrom.sym
          /tmp/zxrun/bin/tap2sna.py -c fast-load=0 -c accelerator=none -c cmio=1 -c pause=0 --start 32768 dist/carrom.tap /tmp/carrom_std.z80 2>&1 | tee /tmp/std-load.log
          grep -Fq 'Simulation stopped (PC at start address): PC=32768' /tmp/std-load.log
          python3 tools/expand_tzx_runtime.py dist/carrom_fast.tzx /tmp/carrom_fast_runtime.tzx
          for n in 1 2 3; do
            /tmp/zxrun/bin/tap2sna.py -c fast-load=0 -c accelerator=none -c cmio=1 -c pause=0 -c in-flags=1 --start 32768 /tmp/carrom_fast_runtime.tzx "/tmp/carrom_fast_${n}.z80" 2>&1 | tee "/tmp/fast-load-${n}.log"
            grep -Fq 'Simulation stopped (PC at start address): PC=32768' "/tmp/fast-load-${n}.log"
          done
          cp /tmp/carrom_fast_1.z80 /tmp/carrom_fast.z80
          /tmp/zxrun/bin/python tools/sim.py --snap /tmp/carrom_std.z80 --secs 96 --prefix /tmp/std --shots 10,30,65,90 --seed 4660 --accept
          /tmp/zxrun/bin/python tools/sim.py --snap /tmp/carrom_fast.z80 --secs 25 --prefix /tmp/fast --shots 10,25 --seed 4660
          QUITTEST=1 /tmp/zxrun/bin/python tools/sim.py --snap /tmp/carrom_std.z80 --secs 12 --prefix /tmp/quit-std --seed 4660 --quiet --quit-check
          QUITTEST=1 /tmp/zxrun/bin/python tools/sim.py --snap /tmp/carrom_fast.z80 --secs 12 --prefix /tmp/quit-fast --seed 4660 --quiet --quit-check

      - name: Record SHA-256 hashes
        run: |
          sha256sum build/carrom.bin dist/carrom.tap dist/carrom_fast.tzx dist/zx-carrom.zip | tee dist/SHA256SUMS

      - name: Verify clean source state
        run: |
          git diff --exit-code -- . ':(exclude)dist/carrom.tap' ':(exclude)dist/carrom_fast.tzx' ':(exclude)dist/zx-carrom.zip' ':(exclude)dist/SHA256SUMS'

      - name: Round-trip and commit accepted deliverables
        run: |
          mkdir -p /tmp/release64
          for f in carrom.tap carrom_fast.tzx zx-carrom.zip; do
            base64 -w 0 "dist/$f" > "/tmp/release64/$f.b64"
            base64 -d "/tmp/release64/$f.b64" > "/tmp/release64/$f"
            cmp "dist/$f" "/tmp/release64/$f"
            mv "/tmp/release64/$f" "dist/$f"
          done
          sha256sum -c dist/SHA256SUMS
          git config user.name "zx-carrom-release"
          git config user.email "zx-carrom-release@users.noreply.github.com"
          git add -f dist/carrom.tap dist/carrom_fast.tzx dist/zx-carrom.zip dist/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "Store accepted release outputs"
            git push origin HEAD:main
          fi

      - name: Upload accepted release
        uses: actions/upload-artifact@v4
        with:
          name: zx-carrom-release
          path: |
            dist/carrom.tap
            dist/carrom_fast.tzx
            dist/zx-carrom.zip
            dist/SHA256SUMS
          if-no-files-found: error
