name: clean-build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - '.github/workflows/tag-*.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zx-carrom-clean-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PASMO_BRANCH: main
      SKOOLKIT_BRANCH: master
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Repository vocabulary gate
        run: |
          python3 tools/check_restricted_terms.py --tree --head-message

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake make git python3 python3-venv fuse-emulator-gtk spectrum-roms xvfb
          python3 -m venv /tmp/zxrun
          git clone --depth 1 --branch "$SKOOLKIT_BRANCH" https://github.com/tuklusan/skoolkit.git /tmp/skoolkit
          /tmp/zxrun/bin/pip install --disable-pip-version-check /tmp/skoolkit pillow

      - name: Build Pasmo from authoritative fork
        run: |
          git clone --depth 1 --branch "$PASMO_BRANCH" https://github.com/tuklusan/pasmo.git /tmp/pasmo
          cd /tmp/pasmo
          ./configure
          make -j2
          ./pasmo --version || true

      - name: Measure current boundary
        run: |
          python3 tools/prepare_pasmo.py /tmp/carrom_diag.asm
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/carrom_diag.asm')
          s = p.read_text()
          s = '\n'.join(
              '; boundary measurement only' if 'assertion failed: vars_end < BGBUF' in line else line
              for line in s.splitlines()
          ) + '\n'
          p.write_text(s)
          PY
          /tmp/pasmo/pasmo --bin --pass3 /tmp/carrom_diag.asm /tmp/carrom_diag.bin /tmp/carrom_diag.sym
          grep -E '^(QSQ|code_end|vars_end|BGBUF)' /tmp/carrom_diag.sym

      - name: Clean production build 1
        env:
          PASMO: /tmp/pasmo/pasmo
        run: |
          python3 build.py
          mkdir -p /tmp/build1
          cp build/carrom.bin dist/carrom_fast.tzx dist/zx-carrom.zip /tmp/build1/

      - name: Clean production build 2 and reproducibility check
        env:
          PASMO: /tmp/pasmo/pasmo
        run: |
          python3 build.py
          cmp /tmp/build1/carrom.bin build/carrom.bin
          cmp /tmp/build1/carrom_fast.tzx dist/carrom_fast.tzx
          cmp /tmp/build1/zx-carrom.zip dist/zx-carrom.zip

      - name: Runtime tape and play checks
        run: |
          cp build/carrom.sym tools/carrom.sym
          python3 tools/expand_tzx_runtime.py dist/carrom_fast.tzx /tmp/carrom_fast_runtime.tzx
          for n in 1 2 3; do
            /tmp/zxrun/bin/tap2sna.py -c fast-load=0 -c accelerator=none -c cmio=1 -c pause=0 -c in-flags=1 --start 32768 /tmp/carrom_fast_runtime.tzx "/tmp/carrom_fast_${n}.z80" 2>&1 | tee "/tmp/fast-load-${n}.log"
            grep -Fq 'Simulation stopped (PC at start address): PC=32768' "/tmp/fast-load-${n}.log"
          done
          cp /tmp/carrom_fast_1.z80 /tmp/carrom_fast.z80
          /tmp/zxrun/bin/python tools/test_player_mapping.py --snap /tmp/carrom_fast.z80 --sym tools/carrom.sym
          /tmp/zxrun/bin/python tools/test_queen_history.py --snap /tmp/carrom_fast.z80 --sym tools/carrom.sym
          /tmp/zxrun/bin/python tools/test_pass_replay.py --snap /tmp/carrom_fast.z80 --sym tools/carrom.sym
          /tmp/zxrun/bin/python tools/test_extra_breaker.py --snap /tmp/carrom_fast.z80 --sym tools/carrom.sym
          /tmp/zxrun/bin/python tools/test_queen_striker.py --snap /tmp/carrom_fast.z80 --sym tools/carrom.sym
          /tmp/zxrun/bin/python tools/test_due_recovery.py --snap /tmp/carrom_fast.z80 --sym tools/carrom.sym
          /tmp/zxrun/bin/python tools/sim.py --snap /tmp/carrom_fast.z80 --secs 0 --prefix /tmp/loadscreen --quiet
          /tmp/zxrun/bin/python tools/sim.py --snap /tmp/carrom_fast.z80 --secs 150 --prefix /tmp/live --shots 1,10,30,65,90,120,145 --seed 4660 --accept
          mkdir -p build/runtime-view
          cp /tmp/loadscreen_end.png build/runtime-view/loading.png
          cp /tmp/live_0001.0.png build/runtime-view/intro.png
          cp /tmp/live_0030.0.png build/runtime-view/board.png
          /tmp/zxrun/bin/python tools/sim.py --snap /tmp/carrom_fast.z80 --secs 25 --prefix /tmp/fast --shots 10,25 --seed 4660
          QUITTEST=1 /tmp/zxrun/bin/python tools/sim.py --snap /tmp/carrom_fast.z80 --secs 12 --prefix /tmp/quit-fast --seed 4660 --quiet --quit-check

      - name: Record release checksums
        run: |
          sha256sum build/carrom.bin build/loading.scr dist/carrom_fast.tzx dist/zx-carrom.zip | tee dist/CHECKSUMS

      - name: Verify clean source state
        run: |
          git diff --exit-code -- . ':(exclude)dist/carrom_fast.tzx' ':(exclude)dist/zx-carrom.zip' ':(exclude)dist/CHECKSUMS'

      - name: Round-trip and commit accepted deliverables
        run: |
          mkdir -p /tmp/release64
          for f in carrom_fast.tzx zx-carrom.zip; do
            base64 -w 0 "dist/$f" > "/tmp/release64/$f.b64"
            base64 -d "/tmp/release64/$f.b64" > "/tmp/release64/$f"
            cmp "dist/$f" "/tmp/release64/$f"
            mv "/tmp/release64/$f" "dist/$f"
          done
          sha256sum -c dist/CHECKSUMS
          git config user.name "zx-carrom-release"
          git config user.email "zx-carrom-release@users.noreply.github.com"
          git add -f dist/carrom_fast.tzx dist/zx-carrom.zip dist/CHECKSUMS
          if ! git diff --cached --quiet; then
            git commit -m "Store accepted release outputs"
            git push origin HEAD:main
          fi

      - name: Upload accepted release
        uses: actions/upload-artifact@v4
        with:
          name: zx-carrom-release
          path: |
            dist/carrom_fast.tzx
            dist/zx-carrom.zip
            dist/CHECKSUMS
          if-no-files-found: error

      - name: Upload runtime view
        uses: actions/upload-artifact@v4
        with:
          name: zx-carrom-runtime-view
          path: build/runtime-view/*.png
          if-no-files-found: error

