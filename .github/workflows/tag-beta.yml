name: beta-tag-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-beta.yml'

permissions:
  contents: write

concurrency:
  group: zx-carrom-clean-build
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag
        run: |
          set -eu
          target=9476e2d7348ea0c26ee5d8177e8712216bf6ad3b
          test "$(git cat-file -t "$target")" = commit
          if git rev-parse -q --verify "refs/tags/beta-0.0.1" >/dev/null; then
            test "$(git rev-list -n 1 beta-0.0.1)" = "$target"
          else
            git config user.name "zx-carrom-release"
            git config user.email "zx-carrom-release@users.noreply.github.com"
            git tag -a beta-0.0.1 "$target" -m "beta-0.0.1"
            git push origin beta-0.0.1
          fi
      - name: Remove temporary workflow
        run: |
          set -eu
          git config user.name "zx-carrom-release"
          git config user.email "zx-carrom-release@users.noreply.github.com"
          git rm .github/workflows/tag-beta.yml
          git commit -m "Remove temporary beta tag workflow"
          git push origin HEAD:main
