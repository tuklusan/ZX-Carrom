name: beta-0.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-beta-0.0.5.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create beta tag
        run: |
          git config user.name "zx-carrom-release"
          git config user.email "zx-carrom-release@users.noreply.github.com"
          target=1688433ace6149faf44d95a51581f9fec7130d0c
          test "$(git rev-parse "$target^{commit}")" = "$target"
          if git rev-parse "refs/tags/beta-0.0.5" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 beta-0.0.5)" = "$target"
            exit 0
          fi
          git tag -a beta-0.0.5 "$target" -m "ZX-Carrom beta 0.0.5"
          git push origin refs/tags/beta-0.0.5
