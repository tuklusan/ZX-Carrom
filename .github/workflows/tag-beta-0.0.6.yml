name: beta-tag-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-beta-0.0.6.yml'

permissions:
  contents: write

concurrency:
  group: zx-carrom-clean-build
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create beta tag
        env:
          TARGET: db47a38fa6f9b172c62fcd07b532c3da5e6d36df
          TAG: beta-0.0.6
        run: |
          set -eu
          git cat-file -e "$TARGET^{commit}"
          git merge-base --is-ancestor "$TARGET" HEAD
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag already exists"
            exit 1
          fi
          git config user.name "zx-carrom-release"
          git config user.email "zx-carrom-release@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Remove this workflow
        run: |
          set -eu
          git config user.name "zx-carrom-release"
          git config user.email "zx-carrom-release@users.noreply.github.com"
          git rm .github/workflows/tag-beta-0.0.6.yml
          git commit -m "Remove one-time beta tag workflow"
          git push origin HEAD:main
